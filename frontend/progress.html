<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress — StudyMate</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell" id="app-shell"></div>
  <div id="page-content" style="display:none">
    <div id="loading" class="loading-center"><div class="spinner"></div></div>
    <div id="content" style="display:none">
      <div class="grid-3 mb-2" id="stats"></div>
      <div class="card mb-2">
        <h3 class="mb-2">Subject Progress</h3>
        <div id="subjects"></div>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!requireAuth()) throw new Error('auth');
    initShell('progress.html');
    async function load() {
      try {
        const [dash, subjects, analytics] = await Promise.all([
          API.get('/dashboard'),
          API.get('/subjects'),
          API.get('/dashboard/analytics'),
        ]);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        const d = dash.data;
        const a = analytics.data;
        document.getElementById('stats').innerHTML = `
          <div class="stat-card"><div class="label">Semester</div><div class="value">${d.semesterProgress || 0}%</div></div>
          <div class="stat-card"><div class="label">Topics done</div><div class="value">${d.completedTopics || 0}/${d.totalTopics || 0}</div></div>
          <div class="stat-card"><div class="label">Tasks done</div><div class="value">${a.completedTasks || 0}/${a.totalTasks || 0}</div></div>
          <div class="stat-card"><div class="label">Goals done</div><div class="value">${a.completedGoals || 0}/${a.totalGoals || 0}</div></div>
          <div class="stat-card"><div class="label">Study time</div><div class="value">${formatMinutes(d.studyTime?.total)}</div></div>
          <div class="stat-card"><div class="label">Streak</div><div class="value">${d.studyStreak?.current || 0} days</div></div>
        `;
        const subs = subjects.data || [];
        document.getElementById('subjects').innerHTML = subs.length ? subs.map((s) => {
          const total = (s.topics || []).length;
          const done = (s.topics || []).filter((t) => t.status === 'completed').length;
          const pct = total ? Math.round((done / total) * 100) : 0;
          return `<div class="mb-2"><div class="flex-between text-sm mb-1"><span>${escapeHtml(s.name)}</span><span>${pct}% (${done}/${total})</span></div>
            <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div></div>`;
        }).join('') : '<p class="text-muted">Add subjects to see progress.</p>';
      } catch (err) {
        document.getElementById('loading').innerHTML = '<p class="text-muted">' + escapeHtml(err.message) + '</p>';
      }
    }
    load();
  </script>
</body>
</html>
