<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — StudyMate</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo-row">
        <div class="logo" style="width:40px;height:40px;background:linear-gradient(135deg,#B45309,#D97706);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700">S</div>
        <span style="font-weight:700;font-size:1.25rem;color:#1C1917">StudyMate</span>
      </div>
      <h2>Welcome back</h2>
      <p class="sub">Login to continue your study journey</p>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" required autocomplete="email" placeholder="you@college.edu">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" required autocomplete="current-password" placeholder="Your password" minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Login</button>
      </form>
      <p class="auth-footer">Don't have an account? <a href="register.html">Register</a></p>
      <p class="auth-footer"><a href="index.html">← Back to home</a></p>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    if (API.getToken()) {
      const u = API.getUser();
      window.location.href = u && !u.onboardingCompleted ? 'onboarding.html' : 'dashboard.html';
    }
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Logging in...';
      try {
        const res = await API.post('/auth/login', {
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        });
        API.setAuth(res.token, res.user);
        showToast('Welcome back!', 'success');
        window.location.href = res.user.onboardingCompleted ? 'dashboard.html' : 'onboarding.html';
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
