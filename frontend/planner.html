<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Planner — StudyMate</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell" id="app-shell"></div>
  <div id="page-content" style="display:none">
    <div class="flex-between mb-2 flex-wrap gap-1">
      <div class="filters">
        <button class="filter-chip active" data-view="today">Today</button>
        <button class="filter-chip" data-view="week">This Week</button>
        <button class="filter-chip" data-view="upcoming">Upcoming</button>
      </div>
      <button class="btn btn-primary" id="add-btn">+ Add Plan</button>
    </div>
    <div class="card" id="list"></div>
  </div>
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <div class="modal-header"><h3>Study Plan</h3><button class="modal-close" data-close>&times;</button></div>
      <form id="form">
        <input type="hidden" id="id">
        <div class="form-group"><label>Subject</label><select id="subject" class="form-control"><option value="">None</option></select></div>
        <div class="form-group"><label>Unit</label><input id="unit" class="form-control"></div>
        <div class="form-group"><label>Topic</label><input id="topic" class="form-control"></div>
        <div class="grid-2">
          <div class="form-group"><label>Date</label><input type="date" id="date" class="form-control" required></div>
          <div class="form-group"><label>Start time</label><input type="time" id="startTime" class="form-control" value="09:00"></div>
        </div>
        <div class="grid-2">
          <div class="form-group"><label>Duration (min)</label><input type="number" id="duration" class="form-control" min="5" max="480" value="60" required></div>
          <div class="form-group"><label>Priority</label>
            <select id="priority" class="form-control"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select>
          </div>
        </div>
        <div class="form-group"><label>Notes</label><textarea id="notes" class="form-control"></textarea></div>
        <button type="submit" class="btn btn-primary btn-block">Save</button>
      </form>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!requireAuth()) throw new Error('auth');
    initShell('planner.html');
    let view = 'today';
    document.querySelector('[data-close]').onclick = () => document.getElementById('modal').classList.remove('show');
    document.querySelector('.filters').onclick = (e) => {
      if (!e.target.dataset.view) return;
      view = e.target.dataset.view;
      document.querySelectorAll('.filter-chip').forEach((c) => c.classList.toggle('active', c.dataset.view === view));
      load();
    };
    document.getElementById('add-btn').onclick = () => {
      document.getElementById('form').reset();
      document.getElementById('id').value = '';
      document.getElementById('date').value = new Date().toISOString().slice(0, 10);
      document.getElementById('duration').value = 60;
      document.getElementById('startTime').value = '09:00';
      document.getElementById('modal').classList.add('show');
    };
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('id').value;
      const body = {
        subject: document.getElementById('subject').value || undefined,
        unit: document.getElementById('unit').value,
        topic: document.getElementById('topic').value,
        date: document.getElementById('date').value,
        startTime: document.getElementById('startTime').value,
        duration: Number(document.getElementById('duration').value),
        priority: document.getElementById('priority').value,
        notes: document.getElementById('notes').value,
      };
      try {
        if (id) await API.put(`/plans/${id}`, body);
        else await API.post('/plans', body);
        document.getElementById('modal').classList.remove('show');
        showToast('Saved', 'success');
        load();
      } catch (err) { showToast(err.message, 'error'); }
    };
    async function load() {
      try {
        const res = await API.get('/plans?view=' + view);
        const plans = res.data || [];
        const list = document.getElementById('list');
        if (!plans.length) {
          list.innerHTML = '<div class="empty-state"><div class="empty-icon">📅</div><h3>No study plans</h3><p>Schedule a study session to stay on track.</p></div>';
          return;
        }
        list.innerHTML = plans.map((p) => `
          <div class="list-item">
            <div class="meta">
              <div class="title">${escapeHtml(p.topic || p.unit || 'Study session')}</div>
              <div class="desc">${p.subject?.name || ''} · ${formatDate(p.date)} · ${p.startTime} · ${p.duration} min · 
                <span class="badge">${p.status}</span> · ${p.priority}
              </div>
            </div>
            ${p.status === 'planned' ? `<button class="btn btn-sm btn-secondary" data-done="${p._id}">Done</button>` : ''}
            <button class="btn btn-sm btn-outline" data-del="${p._id}" style="color:var(--danger)">×</button>
          </div>`).join('');
        list.querySelectorAll('[data-done]').forEach((btn) => {
          btn.onclick = async () => {
            try { await API.put(`/plans/${btn.dataset.done}`, { status: 'completed' }); showToast('Completed', 'success'); load(); }
            catch (e) { showToast(e.message, 'error'); }
          };
        });
        list.querySelectorAll('[data-del]').forEach((btn) => {
          btn.onclick = async () => {
            if (!confirm('Delete?')) return;
            try { await API.del(`/plans/${btn.dataset.del}`); load(); }
            catch (e) { showToast(e.message, 'error'); }
          };
        });
      } catch (err) { showToast(err.message, 'error'); }
    }
    API.get('/subjects').then((r) => {
      (r.data || []).forEach((s) => {
        const o = document.createElement('option');
        o.value = s._id; o.textContent = s.name;
        document.getElementById('subject').appendChild(o);
      });
    });
    load();
  </script>
</body>
</html>
