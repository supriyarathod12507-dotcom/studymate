<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Resources — StudyMate</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell" id="app-shell"></div>
  <div id="page-content" style="display:none">
    <div class="flex-between mb-2 flex-wrap gap-1">
      <input type="search" id="search" class="form-control" placeholder="Search..." style="max-width:200px">
      <button class="btn btn-primary" id="add-btn">+ Add Resource</button>
    </div>
    <div id="list" class="grid-2"></div>
  </div>
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <div class="modal-header"><h3>Resource</h3><button class="modal-close" data-close>&times;</button></div>
      <form id="form">
        <input type="hidden" id="id">
        <div class="form-group"><label>Title</label><input id="title" class="form-control" required></div>
        <div class="form-group"><label>Type</label>
          <select id="type" class="form-control">
            <option value="youtube">YouTube</option>
            <option value="website">Website</option>
            <option value="pdf">PDF</option>
            <option value="article">Article</option>
            <option value="documentation">Documentation</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group"><label>URL</label><input id="url" type="url" class="form-control" required placeholder="https://"></div>
        <div class="form-group"><label>Subject</label><select id="subject" class="form-control"><option value="">None</option></select></div>
        <div class="form-group"><label>Topic</label><input id="topic" class="form-control"></div>
        <div class="form-group"><label>Description</label><textarea id="desc" class="form-control"></textarea></div>
        <button type="submit" class="btn btn-primary btn-block">Save</button>
      </form>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!requireAuth()) throw new Error('auth');
    initShell('resources.html');
    document.querySelector('[data-close]').onclick = () => document.getElementById('modal').classList.remove('show');
    document.getElementById('add-btn').onclick = () => {
      document.getElementById('form').reset();
      document.getElementById('id').value = '';
      document.getElementById('modal').classList.add('show');
    };
    document.getElementById('search').oninput = () => load();
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('id').value;
      const body = {
        title: document.getElementById('title').value.trim(),
        type: document.getElementById('type').value,
        url: document.getElementById('url').value.trim(),
        subject: document.getElementById('subject').value || undefined,
        topic: document.getElementById('topic').value,
        description: document.getElementById('desc').value,
      };
      try {
        if (id) await API.put('/resources/' + id, body);
        else await API.post('/resources', body);
        document.getElementById('modal').classList.remove('show');
        showToast('Saved', 'success');
        load();
      } catch (err) { showToast(err.message, 'error'); }
    };
    async function load() {
      try {
        const q = document.getElementById('search').value.trim();
        const res = await API.get('/resources' + (q ? '?search=' + encodeURIComponent(q) : ''));
        const items = res.data || [];
        const list = document.getElementById('list');
        if (!items.length) {
          list.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🔗</div><h3>No resources yet</h3><p>Save useful links, videos and PDFs.</p></div>';
          return;
        }
        list.innerHTML = items.map((r) => `
          <div class="card">
            <div class="flex-between mb-1"><h3>${escapeHtml(r.title)}</h3><span class="badge">${r.type}</span></div>
            <p class="text-sm text-muted mb-1">${r.subject?.name || ''} ${r.topic ? '· ' + escapeHtml(r.topic) : ''}</p>
            <a href="${escapeHtml(r.url)}" target="_blank" rel="noopener" class="text-sm">Open link →</a>
            ${r.description ? '<p class="text-sm mt-1">' + escapeHtml(r.description) + '</p>' : ''}
            <button class="btn btn-sm btn-outline mt-1 del-btn" data-id="${r._id}" style="color:var(--danger)">Delete</button>
          </div>`).join('');
        list.querySelectorAll('.del-btn').forEach((btn) => {
          btn.onclick = async () => {
            if (!confirm('Delete?')) return;
            try { await API.del('/resources/' + btn.dataset.id); load(); } catch (e) { showToast(e.message, 'error'); }
          };
        });
      } catch (err) { showToast(err.message, 'error'); }
    }
    API.get('/subjects').then((r) => {
      (r.data || []).forEach((s) => {
        const o = document.createElement('option');
        o.value = s._id; o.textContent = s.name;
        document.getElementById('subject').appendChild(o);
      });
    });
    load();
  </script>
</body>
</html>
